{% extends "base.html" %}

{% block title %}Add Availability Hours{% endblock title %}

{% block content %}

<section class="auth-page">

    <div class="auth-container">

        <!-- Page Header -->
        <div class="auth-header">

            <span class="auth-badge">
                MANAGE AVAILABILITY
            </span>

            <h1>
                Add Tutoring <span>Hours.</span>
            </h1>

            <p>
                Let students know when you're available
                to help them succeed.
            </p>

        </div>

        <!-- Availability Form -->
        <div class="auth-card availability-card">

            <form method="post" action="{% url 'add_hours' %}">

                {% csrf_token %}

                <div class="availability-fields">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="auth-submit">
                    Save Availability →
                </button>

                <a href="{% url 'home' %}" class="cancel-button">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</section>

{% endblock content %}
